<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BSCMLS Market Overview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff; --text: #212529; --muted: #6c757d; --border: #dee2e6;
    --band: #f1f1f1; --link: #0d6efd; --btn: #dc3545; --up: #1db980; --down: #c00020;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  body { padding: 12px; }
  h1 { text-align: center; font-family: "Lexend", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 1.6rem; margin: 4px 0 4px; font-weight: 600; }
  .updated { text-align: center; color: var(--muted); font-size: .85rem; margin: 0 0 12px; }
  .bar { display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; flex-wrap: wrap; }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .tab { border: 1px solid transparent; border-bottom: none; background: none; color: var(--link); padding: 9px 16px; font-size: 1rem; cursor: pointer; border-radius: 4px 4px 0 0; margin-bottom: -1px; }
  .tab[aria-selected="true"] { color: var(--muted); background: var(--bg); border-color: var(--border); }
  .pdfbtn { background: var(--btn); color: #fff; border: 0; border-radius: 4px; padding: 8px 18px; font-size: .95rem; cursor: pointer; margin-bottom: 6px; }
  .pdfbtn:disabled { opacity: .6; cursor: wait; }
  .wrap { overflow-x: auto; border: 1px solid var(--border); }
  table { width: 100%; border-collapse: collapse; min-width: 640px; table-layout: fixed; }
  th, td { padding: 14px 12px; text-align: left; border-left: 1px solid var(--border); }
  th:first-child, td:first-child { border-left: 0; }
  th { font-weight: 700; border-bottom: 2px solid var(--border); white-space: nowrap; }
  td:first-child { color: #000000; }
  tbody tr:nth-child(odd) { background: var(--band); }
  td.cur { font-weight: 700; white-space: nowrap; }
  .ind { float: right; margin-left: 14px; font-size: .8rem; }
  .up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--muted); }
  .legend { background: var(--band); text-align: center; padding: 12px; font-size: .92rem; border-top: 1px solid var(--border); }
  .legend span { margin: 0 10px; white-space: nowrap; }
  .src { text-align: center; color: var(--muted); font-size: .75rem; margin-top: 8px; }
  /* off-screen sheet used only to make the PDF */
  #sheet { position: absolute; left: -10000px; top: 0; width: 1000px; background: #fff; padding: 20px 24px; }
  #sheet h2 { font-size: 1.15rem; margin: 18px 0 6px; font-weight: 600; }
  #sheet table { min-width: 0; border: 1px solid var(--border); }
  #sheet th, #sheet td { padding: 9px 12px; }
</style>
</head>
<body>
<h1 id="title">BSCMLS Market Overview</h1>
<p class="updated" id="updated"></p>
<div class="bar">
  <div class="tabs" role="tablist" id="tabs"></div>
  <button class="pdfbtn" id="pdf">&#8681; PDF</button>
</div>
<div class="wrap">
  <table><colgroup><col style="width:31%"><col style="width:23%"><col style="width:23%"><col style="width:23%"></colgroup><thead id="head"></thead><tbody id="rows"></tbody></table>
  <div class="legend">The change from the previous <b>Month</b>:
    <span><b class="up">&#9650;</b> Increased</span>
    <span><b class="down">&#9660;</b> Decreased</span>
    <span><b class="flat">&#8596;</b> No Change</span>
  </div>
</div>
<div class="src" id="src"></div>
<div id="sheet"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
/* Data is loaded from data.json (refreshed monthly by the GitHub Action). */
var DATA = null;
var TABS = [["sfh", "Single Family Homes"], ["condo", "Condo / Townhomes"], ["land", "Vacant Land"]];
var COMMON = [
  ["closed", "Closed Sales", "int"],
  ["price",  "Median Sale Price", "usd"],
  ["dom",    "Median Days on Market", "int"],
  ["newl",   "New Listings", "int"],
  ["ratio",  "Sale to List Price Ratio", "pct"]
];
function metricsFor(key) {
  return COMMON.concat(key === "land"
    ? [["ppacre", "Average Sale Price per Acre", "usd"]]
    : [["ppsf", "Average Sale Price per Square Foot", "usd"]]);
}
function fmt(v, t) {
  if (v === null || v === undefined) return "\u2014";
  if (t === "usd") return "$" + Math.round(v).toLocaleString("en-US");
  if (t === "pct") return Math.round(v) + "%";
  return Math.round(v).toLocaleString("en-US");
}
function ind(cur, prev, t) {
  if (cur == null || prev == null) return "";
  var a = Math.round(cur), b = Math.round(prev);
  if (a > b) return '<span class="ind up">&#9650;</span>';
  if (a < b) return '<span class="ind down">&#9660;</span>';
  return '<span class="ind flat">&#8596;</span>';
}
function headHTML() {
  return "<tr><th></th>" + DATA.periods.map(function (p) { return "<th>" + p + "</th>"; }).join("") + "</tr>";
}
function bodyHTML(key) {
  var d = DATA[key], html = "";
  metricsFor(key).forEach(function (m) {
    var v = d[m[0]] || [null, null, null], t = m[2];
    html += "<tr><td>" + m[1] + '</td><td class="cur">' + fmt(v[0], t) + ind(v[0], v[1], t) +
            "</td><td>" + fmt(v[1], t) + "</td><td>" + fmt(v[2], t) + "</td></tr>";
  });
  return html;
}
function prettyDate(iso) {
  if (!iso) return "";
  var p = iso.split("-"), names = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  return names[+p[1] - 1] + " " + (+p[2]) + ", " + p[0];
}
var COLS = '<colgroup><col style="width:31%"><col style="width:23%"><col style="width:23%"><col style="width:23%"></colgroup>';
var current = "sfh";
function render() {
  document.getElementById("title").textContent = "BSCMLS Market Overview";
  document.getElementById("updated").textContent = DATA.updated ? "Data updated " + prettyDate(DATA.updated) : "";
  document.getElementById("tabs").innerHTML = TABS.map(function (t) {
    return '<button class="tab" role="tab" data-k="' + t[0] + '" aria-selected="' + (t[0] === current) + '">' + t[1] + "</button>";
  }).join("");
  document.querySelectorAll(".tab").forEach(function (b) {
    b.addEventListener("click", function () { current = b.dataset.k; render(); });
  });
  document.getElementById("head").innerHTML = headHTML();
  document.getElementById("rows").innerHTML = bodyHTML(current);
  document.getElementById("src").textContent = DATA.asOf;
}

/* PDF: builds a one-page sheet with all tables stacked, then snapshots it. */
function buildSheet() {
  var h = '<h1 style="margin:0 0 4px">BSCMLS Market Overview</h1>';
  h += '<p class="updated">' + (DATA.updated ? "Data updated " + prettyDate(DATA.updated) : "") + "</p>";
  TABS.forEach(function (t) {
    h += "<h2>" + t[1] + "</h2><table>" + COLS + "<thead>" + headHTML() + "</thead><tbody>" + bodyHTML(t[0]) + "</tbody></table>";
  });
  h += '<div class="legend" style="margin-top:12px;border:1px solid var(--border)">The change from the previous <b>Month</b>: ' +
       '<span><b class="up">&#9650;</b> Increased</span><span><b class="down">&#9660;</b> Decreased</span>' +
       '<span><b class="flat">&#8596;</b> No Change</span></div>';
  h += '<div class="src">' + DATA.asOf + "</div>";
  document.getElementById("sheet").innerHTML = h;
  return document.getElementById("sheet");
}
document.getElementById("pdf").addEventListener("click", function () {
  var btn = this, label = btn.innerHTML;
  btn.disabled = true; btn.textContent = "Creating PDF\u2026";
  var sheet = buildSheet();
  var fontReady = (document.fonts && document.fonts.load) ? document.fonts.load("600 24px Lexend").catch(function () {}) : null;
  Promise.resolve(fontReady).then(function () {
    return html2canvas(sheet, { scale: 2, backgroundColor: "#ffffff" });
  }).then(function (canvas) {
    var pdf = new window.jspdf.jsPDF({ unit: "pt", format: "letter", orientation: "portrait" });
    var pw = pdf.internal.pageSize.getWidth(), ph = pdf.internal.pageSize.getHeight(), m = 28;
    var s = Math.min((pw - 2 * m) / canvas.width, (ph - 2 * m) / canvas.height);
    var w = canvas.width * s, hgt = canvas.height * s;
    pdf.addImage(canvas.toDataURL("image/png"), "PNG", (pw - w) / 2, m, w, hgt);
    pdf.save("BSCMLS-Market-Overview-" + (DATA.updated || "latest") + ".pdf");
  }).catch(function () {
    alert("Sorry, the PDF could not be created.");
  }).then(function () {
    document.getElementById("sheet").innerHTML = "";
    btn.disabled = false; btn.innerHTML = label;
  });
});

fetch("data.json?v=" + Date.now()).then(function (r) { return r.json(); }).then(function (d) {
  DATA = d; render();
}).catch(function () { document.getElementById("src").textContent = "Data unavailable."; });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market Overview – Big Sky Country MLS</title>
<style>
  :root {
    --bg: #ffffff; --text: #212529; --muted: #6c757d; --border: #dee2e6;
    --band: #f1f1f1; --link: #0d6efd; --btn: #dc3545; --up: #1db980; --down: #c00020;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1d20; --text: #e9ecef; --muted: #9aa1a8; --border: #3a3f45; --band: #25282c; --link: #6ea8fe; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  body { padding: 12px; }
  h1 { text-align: center; font-size: 1.6rem; margin: 4px 0 14px; font-weight: 600; }
  .bar { display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; }
  .tabs { display: flex; gap: 4px; }
  .tab { border: 1px solid transparent; border-bottom: none; background: none; color: var(--link); padding: 9px 16px; font-size: 1rem; cursor: pointer; border-radius: 4px 4px 0 0; margin-bottom: -1px; }
  .tab[aria-selected="true"] { color: var(--muted); background: var(--bg); border-color: var(--border); }
  .export { background: var(--btn); color: #fff; border: 0; border-radius: 4px; padding: 8px 14px; font-size: .95rem; cursor: pointer; margin-bottom: 6px; }
  .wrap { overflow-x: auto; border: 1px solid var(--border); }
  table { width: 100%; border-collapse: collapse; min-width: 520px; }
  th, td { padding: 14px 12px; text-align: left; border-left: 1px solid var(--border); }
  th:first-child, td:first-child { border-left: 0; }
  th { font-weight: 700; border-bottom: 2px solid var(--border); }
  td:first-child { color: var(--muted); }
  tbody tr:nth-child(odd) { background: var(--band); }
  td.cur { font-weight: 700; white-space: nowrap; }
  .ind { float: right; margin-left: 14px; font-size: .8rem; }
  .up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--muted); }
  .legend { background: var(--band); text-align: center; padding: 12px; font-size: .92rem; border-top: 1px solid var(--border); }
  .legend span { margin: 0 10px; white-space: nowrap; }
  .src { text-align: center; color: var(--muted); font-size: .75rem; margin-top: 8px; }
</style>
</head>
<body>
<h1 id="title">Market Overview</h1>
<div class="bar">
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-k="sfh" aria-selected="true">Single Family Homes</button>
    <button class="tab" role="tab" data-k="condo" aria-selected="false">Condo / Townhomes</button>
  </div>
  <button class="export" id="export">&#8681; Export Table</button>
</div>
<div class="wrap"><table>
  <thead><tr><th></th><th id="h0"></th><th id="h1"></th><th id="h2"></th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<div class="legend">The change from the previous <b>Month</b>:
  <span><b class="up">&#9650;</b> Increased</span>
  <span><b class="down">&#9660;</b> Decreased</span>
  <span><b class="flat">&#8596;</b> No Change</span>
</div></div>
<div class="src" id="src"></div>

<script>
/* ---- DATA: edit/replace this block each month (or load it from your feed) ----
   Order in each array: [current month, previous month, same month last year].
   null = not available yet (shows an em dash). */
var DATA = null;

var METRICS = [
  ["closed", "Closed Sales", "int"],
  ["price",  "Median Sale Price", "usd"],
  ["dom",    "Median Days on Market", "int"],
  ["newl",   "New Listings", "int"],
  ["ratio",  "Sale to List Price Ratio", "pct"],
  ["ppsf",   "Average Sale Price per Square Foot", "usd"]
];

function fmt(v, t) {
  if (v === null || v === undefined) return "\u2014";
  if (t === "usd") return "$" + Math.round(v).toLocaleString("en-US");
  if (t === "pct") return Math.round(v) + "%";
  return Math.round(v).toLocaleString("en-US");
}
function ind(cur, prev, t) {
  if (cur == null || prev == null) return "";
  var a = Number(fmt(cur, t).replace(/[^0-9.]/g, "")), b = Number(fmt(prev, t).replace(/[^0-9.]/g, ""));
  if (a > b) return '<span class="ind up">&#9650;</span>';
  if (a < b) return '<span class="ind down">&#9660;</span>';
  return '<span class="ind flat">&#8596;</span>';
}

var current = "sfh";
function render() {
  var d = DATA[current];
  document.getElementById("title").textContent = "Market Overview of " + DATA.area;
  ["h0", "h1", "h2"].forEach(function (id, i) { document.getElementById(id).textContent = DATA.periods[i]; });
  var html = "";
  METRICS.forEach(function (m) {
    var v = d[m[0]], t = m[2];
    html += "<tr><td>" + m[1] + '</td><td class="cur">' + fmt(v[0], t) + ind(v[0], v[1], t) +
            "</td><td>" + fmt(v[1], t) + "</td><td>" + fmt(v[2], t) + "</td></tr>";
  });
  document.getElementById("rows").innerHTML = html;
  document.getElementById("src").textContent = DATA.asOf;
  document.querySelectorAll(".tab").forEach(function (b) { b.setAttribute("aria-selected", b.dataset.k === current); });
}
document.querySelectorAll(".tab").forEach(function (b) {
  b.addEventListener("click", function () { current = b.dataset.k; render(); });
});
document.getElementById("export").addEventListener("click", function () {
  var d = DATA[current], rows = [["Metric"].concat(DATA.periods)];
  METRICS.forEach(function (m) { rows.push([m[1]].concat(d[m[0]].map(function (v) { return v == null ? "" : v; }))); });
  var csv = rows.map(function (r) { return r.map(function (c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(","); }).join("\n");
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
  a.download = "market-overview-" + current + ".csv";
  document.body.appendChild(a); a.click(); a.remove();
});
fetch("data.json?v=" + Date.now()).then(function (r) { return r.json(); }).then(function (d) { DATA = d; render(); }).catch(function () { document.getElementById("src").textContent = "Data unavailable."; });
</script>
</body>
</html>
